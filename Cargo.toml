[workspace]
members = [
    "crates/domain",
    "crates/cal",
    "crates/seed",
    "crates/rules",
    "crates/meihua",
    "crates/ir",
    "crates/store",
    "crates/app",
    "crates/cli",
    "tools/gen-cal",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
getrandom = "0.3"
unicode-normalization = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
